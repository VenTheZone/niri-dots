include dark-theme.auto.conf

# Add your custom configurations here
# term xterm-kitty  # Uncomment if needed, but kitty sets this automatically
shell zsh

# Font fix: monospace + Nerd Font fallback for icons, tied line-spacing
font_family      Maple Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# Force monospace cell metric so glyphs don't drift apart
font_features none
# Powerline tab corners (Maple Mono does not ship these glyphs)
symbol_map U+E0B0-U+E0D4 Symbols Nerd Font

# Lucy — neon chrome
window_padding_width 12
window_border_width 1.5pt
draw_minimal_borders yes
inactive_text_alpha 0.68
dim_opacity 0.4
underline_hyperlinks always
detect_urls yes
modify_font underline_thickness 180%
modify_font underline_position 2px

# Original Lucy title bar: slanted powerline, always on
tab_bar_min_tabs 1
tab_bar_edge top
tab_bar_align left
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {title} "
active_tab_title_template " {title} "

# Trail value is "sit still this many ms before a jump counts".
cursor_trail 1
cursor_trail_decay 0.06 0.22
cursor_trail_start_threshold 0
cursor_trail_color #ff2a9d

enable_audio_bell no
visual_bell_duration 0.16
visual_bell_color #ff2a9d

