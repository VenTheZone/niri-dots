include dark-theme.auto.conf

# Add your custom configurations here
# term xterm-kitty  # Uncomment if needed, but kitty sets this automatically
shell zsh

# Font fix: monospace + Nerd Font fallback for icons, tied line-spacing
font_family      Maple Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# Force monospace cell metric so glyphs don't drift apart
font_features none

# Lucy — readable neon chrome (must be obvious vs the old netrunner theme)
window_padding_width 10
inactive_text_alpha 0.78
underline_hyperlinks hover
detect_urls yes
tab_bar_min_tabs 1
tab_bar_edge top

# Trail value is "sit still this many ms before a jump counts".
# 200 almost never fires while typing; 3 is visible on every hop.
cursor_trail 3
cursor_trail_decay 0.08 0.28
cursor_trail_start_threshold 1
cursor_trail_color #ff2a9d

enable_audio_bell no
visual_bell_duration 0.1
visual_bell_color #ff2a9d
