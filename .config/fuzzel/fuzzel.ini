# Cyberpunk 2077 Fuzzel Configuration
# Night City dark app launcher

# General settings
font = JetBrainsMono Nerd Font:size=14
icon-theme = Papirus-Dark
fields = filename,name,generic,comment
terminal = alacritty

# Cyberpunk colorscheme
[colors]
     background = 0a0a0eD9
     text = d6d6cdFF
     match = d9bd08FF
     selection = 1c1c24FF
     selection-text = d9bd08FF
     border = 2a2a33FF

# Cyberpunk styling
border-radius = 8
border-width = 2
padding = 12 16

# Cyberpunk glow effect
line-height = 24
letter-spacing = 1

# Window behavior
anchor = center
width = 600
height = 400
exit-on-keyboard-focus-loss = true

# Key bindings
[keybindings]
# Navigation
Ctrl-j = down
Ctrl-k = up
Ctrl-n = down
Ctrl-p = up
Alt-j = down
Alt-k = up

# Actions
Return = accept
Escape = dismiss+clear
Ctrl-Return = accept-custom
Alt-Return = accept-custom
Ctrl-space = dismiss
Tab = cursor-down
Ctrl-Tab = cursor-up

# History
Ctrl-r = history-prev
Ctrl-s = history-next

# Cyberpunk specific
Ctrl-q = quit