# Cyberpunk 2077 Fuzzel Configuration
# Styled like the wallpaper dial. Launched through Quickshell (`qs ipc call launcher open`),
# which overrides the yellow accent below with the current poster's accent.

[main]
font = JetBrainsMono Nerd Font:size=13
icon-theme = Papirus-Dark
fields = filename,name,generic,comment
terminal = alacritty
prompt = "  "
placeholder = "jack in..."
anchor = center
width = 38
lines = 8
horizontal-pad = 22
vertical-pad = 18
inner-pad = 14
line-height = 30
letter-spacing = 0.5
match-counter = yes
image-size-ratio = 0
exit-on-keyboard-focus-loss = yes

[colors]
background = 0d0d11f2
text = d6d6cdff
input = ffffffff
placeholder = 5c5c66ff
counter = 5c5c66ff
prompt = f3e600ff
match = f3e600ff
selection = f3e600ff
selection-text = 0d0d11ff
selection-match = 0d0d11ff
border = f3e600ff

[border]
width = 3
radius = 18
selection-radius = 10

[key-bindings]
delete-line-forward = none
next = Down Control+n Control+j Mod1+j
prev = Up Control+p Control+k Mod1+k
