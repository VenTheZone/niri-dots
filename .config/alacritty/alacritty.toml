# Edgerunners David — acid yellow / Arasaka red. Lucy cyan lives in kitty.

[colors.primary]
background = "0x14080c"
foreground = "0xe8e6d9"
dim_foreground = "0x8a8a82"
bright_foreground = "0xf5f5ee"

[colors]
draw_bold_text_with_bright_colors = true

[colors.cursor]
cursor = "0xfcee0a"
text = "0x0a0a0e"

[colors.vi_mode_cursor]
cursor = "0xff003c"
text = "0x0a0a0e"

[colors.selection]
background = "0x4a1224"
text = "CellForeground"

[colors.search.matches]
background = "0xfcee0a"
foreground = "0x0a0a0e"

[colors.search.focused_match]
background = "0xff003c"
foreground = "0x0a0a0e"

[colors.footer_bar]
foreground = "0x0a0a0e"
background = "0xfcee0a"

[colors.line_indicator]
foreground = "0x0a0a0e"
background = "0xff003c"

[colors.hints.start]
foreground = "0x0a0a0e"
background = "0xfcee0a"

[colors.hints.end]
foreground = "0x0a0a0e"
background = "0xff003c"

[bell]
animation = "EaseOutExpo"
duration = 80
color = "0xff003c"

[colors.normal]
black = "0x14141b"
red = "0xff003c"
green = "0x05ffa1"
yellow = "0xfcee0a"
blue = "0x2b8cff"
magenta = "0xff2a9d"
cyan = "0x00f0ff"
white = "0xd6d6cd"

[colors.bright]
black = "0x3a3a48"
red = "0xff4d6d"
green = "0x7dffc4"
yellow = "0xfff566"
blue = "0x6db3ff"
magenta = "0xff6ec7"
cyan = "0x5cf7ff"
white = "0xf5f5ee"

[colors.dim]
black = "0x0d0d11"
red = "0x99243a"
green = "0x03995f"
yellow = "0x998c07"
blue = "0x1a5499"
magenta = "0x99195e"
cyan = "0x009099"
white = "0x8a8a82"

[cursor]
blink_interval = 750
blink_timeout = 0
unfocused_hollow = true

[cursor.style]
blinking = "On"
shape = "Block"

[env]
TERM = "alacritty"

[terminal]
shell = { program = "/bin/zsh", args = ["--login", "-i"] }
osc52 = "CopyPaste"

[font]
size = 12.0

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 0


[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "N"
mods = "Control"

[[keyboard.bindings]]
action = "Quit"
key = "Q"
mods = "Control"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Shift"


[mouse]
    hide_when_typing = true
    
    [scrolling]
history = 10000
multiplier = 3

[window]
decorations = "buttonless"
dynamic_padding = true
opacity = 0.95
startup_mode = "Windowed"

[window.padding]
x = 10
y = 10
